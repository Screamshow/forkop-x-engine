name: Build Forkop X Engine
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install OpenWrt APK host tool
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p work/sdk
          curl -fL --retry 3 https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst -o work/sdk.tar.zst
          curl -fL --retry 3 https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/sha256sums -o work/sdk.sha256sums
          expected=$(awk '$2 ~ /openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst$/ {print $1}' work/sdk.sha256sums)
          test -n "$expected"
          echo "$expected  work/sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf work/sdk.tar.zst --strip-components=1 -C work/sdk
          echo "APK_TOOL=$PWD/work/sdk/staging_dir/host/bin/apk" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          expected=$(python3 -c "import json; print(json.load(open('build-config.json')).get('release_tag') or json.load(open('build-config.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$expected"; fi
          bash scripts/build.sh
          ./work/sing-box-amd64 version
          ./work/sing-box-amd64 check -c tests/direct.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sing-box-x-packages
          path: dist/*
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/download-artifact@v4.3.0
        with:
          name: sing-box-x-packages
          path: dist
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(python3 -c "import json; print(json.load(open('build-config.json')).get('release_status', 'candidate'))")
          flags=()
          if [ "$status" != stable ]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "Forkop X Engine $GITHUB_REF_NAME" --notes-file "RELEASE-NOTES-$GITHUB_REF_NAME.md"
